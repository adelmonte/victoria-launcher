name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Remove signing material
        if: always()
        run: rm -f release.keystore keystore.properties

      # Without a keystore the build falls back to app-release-unsigned.apk, so
      # the signed name existing is what proves the secrets were picked up.
      - name: Verify the APK is signed
        run: test -f app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="victoria-launcher-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"

          version_code=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          notes="fastlane/metadata/android/en-US/changelogs/${version_code}.txt"

          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" "$asset"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --generate-notes "$asset"
          fi
